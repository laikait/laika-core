name: Laika PHP Test Suite

on:
  push:
    branches:
      - beta
      - main

  workflow_dispatch:

jobs:
  ########################################################
  # 1/ TEST SUITE
  ########################################################
  php-compatibility:
    name: Validate PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1','8.2','8.3','8.4','8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir || echo ~/.composer/cache)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Only Composer's download cache. Caching "vendor" too would pin the
          # resolved dependency versions across runs, and this repo ships no
          # composer.lock, so a restored vendor/ silently overrides resolution.
          path: ${{ steps.composer-cache.outputs.dir }}
          # Keyed on composer.json: with no composer.lock in this repo,
          # hashFiles('**/composer.lock') is an empty string and the key never
          # changes.
          key: ${{ runner.os }}-composer-v2-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-v2-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, dom
          coverage: ${{ matrix.php-version == '8.1' && 'xdebug' || 'none' }}
          tools: composer

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      # Parses every file with the matrix version's own parser.
      - name: Lint PHP syntax
        run: find src helpers -name '*.php' -print0 | xargs -0 -n1 -- php -l

      # --prefer-dist pulls zipballs from api.github.com and disables source
      # fallback, so a single TLS/network hiccup fails the whole job. Retry
      # over git, which uses the system CA store instead of PHP's curl.
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress \
            || composer install --prefer-source --no-progress

      # Catches what the parser cannot: functions removed or deprecated in a
      # later version, signatures that changed, behaviour flagged for removal.
      - name: PHPCompatibility check (8.1-8.5)
        run: vendor/bin/phpcs --standard=phpcs.xml --report=full

      - name: Run Test Suite
        run: composer test

      - name: Initialize PHP compatibility table
        if: ${{ matrix.php-version == '8.1' }}
        run: |
          echo "| PHP Version | Compatibility |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|---------------|" >> $GITHUB_STEP_SUMMARY

      - name: Append PHP compatibility result
        if: success()
        run: echo "| PHP ${{ matrix.php-version }} | ✅ |" >> $GITHUB_STEP_SUMMARY

      - name: Append PHP compatibility result (failed)
        if: failure()
        run: echo "| PHP ${{ matrix.php-version }} | ❌ |" >> $GITHUB_STEP_SUMMARY

  ########################################################
  # 2/ STATIC ANALYSIS & LINTING
  ########################################################
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: [php-compatibility]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir || echo ~/.composer/cache)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Only Composer's download cache. Caching "vendor" too would pin the
          # resolved dependency versions across runs, and this repo ships no
          # composer.lock, so a restored vendor/ silently overrides resolution.
          path: ${{ steps.composer-cache.outputs.dir }}
          # Keyed on composer.json: with no composer.lock in this repo,
          # hashFiles('**/composer.lock') is an empty string and the key never
          # changes.
          key: ${{ runner.os }}-composer-v2-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-v2-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.1
          tools: composer

      # --prefer-dist pulls zipballs from api.github.com and disables source
      # fallback, so a single TLS/network hiccup fails the whole job. Retry
      # over git, which uses the system CA store instead of PHP's curl.
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress \
            || composer install --prefer-source --no-progress

      - name: Run PHP CS Fixer (dry run)
        run: |
          composer global require friendsofphp/php-cs-fixer
          $(composer global config bin-dir --absolute)/php-cs-fixer fix src --dry-run --diff
