name: Laika PHP Test Suite

on:
  push:
    branches:
      - beta
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  ########################################################
  # 1/ TEST SUITE
  ########################################################
  php-compatibility:
    name: Run Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1','8.2','8.3','8.4','8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir || echo ~/.composer/cache)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, dom
          coverage: ${{ matrix.php-version == '8.1' && 'xdebug' || 'none' }}
          tools: composer

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP Compatibility check
        run: vendor/bin/phpcs --standard=phpcs.xml

      - name: Run Test Suite
        run: composer test

      - name: Initialize PHP compatibility table
        if: ${{ matrix.php-version == '8.1' }}
        run: |
          echo "| PHP Version | Compatibility |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|---------------|" >> $GITHUB_STEP_SUMMARY

      - name: Append PHP compatibility result
        if: success()
        run: echo "| PHP ${{ matrix.php-version }} | ✅ |" >> $GITHUB_STEP_SUMMARY

      - name: Append PHP compatibility result (failed)
        if: failure()
        run: echo "| PHP ${{ matrix.php-version }} | ❌ |" >> $GITHUB_STEP_SUMMARY

  ########################################################
  # 2/ STATIC ANALYSIS & LINTING
  ########################################################
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: [php-compatibility]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir || echo ~/.composer/cache)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: 8.1
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP CS Fixer (dry run)
        run: |
          composer global require friendsofphp/php-cs-fixer
          $(composer global config bin-dir --absolute)/php-cs-fixer fix src --dry-run --diff
